services:
  soundglobalmusic:
    build: .
    container_name: soundglobalmusic
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env.local
    environment:
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
      - proxy_network

  redis:
    image: redis:7-alpine
    container_name: soundglobal-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

volumes:
  redis_data:

networks:
  internal:
    driver: bridge
  proxy_network:
    external: true
    name: proxy_network
